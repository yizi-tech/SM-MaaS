<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>网站设计中 · LLM Maas</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-grad: linear-gradient(135deg, #1677ff 0%, #722ed1 100%);
      --text-primary: rgba(0, 0, 0, 0.88);
      --text-secondary: rgba(0, 0, 0, 0.45);
      --card-bg: rgba(255, 255, 255, 0.82);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(22, 119, 255, 0.14), transparent 60%),
        radial-gradient(1000px 500px at 110% 15%, rgba(114, 46, 209, 0.12), transparent 55%),
        #f5f7fa;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(22, 60, 130, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      padding: 48px 40px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 22px;
      border-radius: 16px;
      background: var(--primary-grad);
      box-shadow: 0 8px 20px rgba(22, 119, 255, 0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 34px; height: 34px; }
    .eyebrow {
      display: inline-block;
      font-size: 12px; font-weight: 600;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--primary);
      background: rgba(22, 119, 255, 0.1);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 14px;
    }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.3px; }
    .sub {
      font-size: 14px; line-height: 1.8;
      color: var(--text-secondary); margin: 0 0 26px;
    }
    .progress {
      height: 6px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.06);
      overflow: hidden; margin-bottom: 26px;
    }
    .progress__bar {
      height: 100%; width: 38%;
      border-radius: 999px;
      background: var(--primary-grad);
      animation: slide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(340%); }
    }
    .tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 26px; }
    .tag {
      font-size: 12px; color: rgba(0, 0, 0, 0.55);
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 5px 12px; border-radius: 999px;
    }
    .foot {
      font-size: 12px; color: var(--text-secondary);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding-top: 16px;
    }
    .foot a { color: var(--primary); text-decoration: none; font-weight: 500; }
    @media (max-width: 480px) {
      .card { padding: 36px 24px 28px; border-radius: 20px; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 2 7l10 5 10-5-10-5Z" /><path d="m2 17 10 5 10-5" /><path d="m2 12 10 5 10-5" />
      </svg>
    </div>
    <span class="eyebrow">Redesigning</span>
    <h1>网站全新设计中</h1>
    <p class="sub">我们正在以 Apple HIG 设计规范对平台进行<br />全新视觉设计与体验升级，敬请期待。</p>
    <div class="progress"><div class="progress__bar"></div></div>
    <div class="tags">
      <span class="tag">🎨 视觉重设计</span>
      <span class="tag">✨ 更现代的界面</span>
      <span class="tag">🚀 更流畅的体验</span>
    </div>
    <div class="foot">如需紧急支持，请联系 <a href="mailto:support@starmoon.ai">support@starmoon.ai</a></div>
  </main>
</body>
</html>
