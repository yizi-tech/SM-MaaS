<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · MAAS</title>
<link rel="stylesheet" href="assets/mm-login.css" />
</head>
<body>
  <div class="mm-page">

    <!-- ============ BrandLogo（占位 SVG，可替换真实品牌） ============ -->
    <header class="mm-logo" aria-label="MAAS">
      <span class="mm-logo__icon" aria-hidden="true">
        <!-- BrandLogo placeholder：可替换为真实品牌 SVG -->
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="7" fill="#E63946"/>
          <path d="M8 20V8l6 8 6-8v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="mm-logo__text">MAAS</span>
    </header>

    <!-- ============ LoginCard ============ -->
    <section class="mm-card">
      <div class="mm-card__body">

        <!-- 左：扫码登录 -->
        <div class="mm-card__left">
          <h2 class="mm-qr__title">扫码登录</h2>
          <div class="mm-qr__box">
            <div class="mm-qr__placeholder">QR_CODE<br/>PLACEHOLDER</div>
          </div>
          <div class="mm-qr__label">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8.7 4C4.9 4 2 6.7 2 9.8c0 1.8 1 3.4 2.5 4.5l-.6 2 2.2-1.2c.8.2 1.6.3 2.6.3h.4A5.6 5.6 0 0 1 9 13.6C9 10.5 12 8 15.6 8h.4C15.4 5.7 12.4 4 8.7 4Z" fill="#07C160"/>
              <path d="M15.6 9.2c-3.4 0-6 2.1-6 4.6 0 2.5 2.6 4.6 6 4.6.8 0 1.5-.1 2.2-.3l1.8 1-.5-1.7c1.4-.9 2.3-2.2 2.3-3.6 0-2.5-2.6-4.6-5.8-4.6Z" fill="#07C160" opacity=".85"/>
            </svg>
            <span>微信扫码登录</span>
          </div>
        </div>

        <div class="mm-card__divider"></div>

        <!-- 右：手机号 / 密码登录 -->
        <div class="mm-card__right">
          <div class="mm-tabs" role="tablist">
            <button type="button" class="is-on" data-tab="code" role="tab">手机登录</button>
            <button type="button" data-tab="password" role="tab">密码登录</button>
          </div>

          <!-- 验证码登录 -->
          <form class="mm-form" id="form-code" novalidate>
            <input class="mm-input" id="phone" type="tel" placeholder="请输入您的手机号" autocomplete="tel" inputmode="numeric" maxlength="11" />
            <div class="mm-code">
              <input class="mm-input" id="code" type="text" placeholder="请输入验证码" autocomplete="one-time-code" inputmode="numeric" maxlength="6" />
              <button type="button" class="mm-code__btn" id="code-send">获取验证码</button>
            </div>
            <p class="mm-error" id="err-code"></p>

            <label class="mm-agreement" for="agree">
              <input type="checkbox" id="agree" />
              <span class="mm-check" aria-hidden="true">
                <svg viewBox="0 0 10 10" fill="none"><path d="M1.5 5.2 4 7.6 8.5 2.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="mm-agreement__text">我已阅读并同意 <a onclick="MM.toast('服务条款（原型）')">服务条款</a> 和 <a onclick="MM.toast('隐私政策（原型）')">隐私政策</a>，未注册的手机号将自动创建账号</span>
            </label>
            <p class="mm-error" id="err-agree-code"></p>

            <button class="mm-submit" type="submit">立即登录</button>
            <p class="mm-region">根据您的地区，已为您跳转至国内网站</p>
          </form>

          <!-- 密码登录 -->
          <form class="mm-form" id="form-password" novalidate hidden>
            <input class="mm-input" id="account" type="text" placeholder="请输入手机号 / 邮箱" autocomplete="username" />
            <input class="mm-input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
            <p class="mm-error" id="err-pwd"></p>

            <label class="mm-agreement" for="agree2">
              <input type="checkbox" id="agree2" />
              <span class="mm-check" aria-hidden="true">
                <svg viewBox="0 0 10 10" fill="none"><path d="M1.5 5.2 4 7.6 8.5 2.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="mm-agreement__text">我已阅读并同意 <a onclick="MM.toast('服务条款（原型）')">服务条款</a> 和 <a onclick="MM.toast('隐私政策（原型）')">隐私政策</a></span>
            </label>
            <p class="mm-error" id="err-agree-pwd"></p>

            <button class="mm-submit" type="submit">立即登录</button>
            <p class="mm-region">根据您的地区，已为您跳转至国内网站</p>
          </form>
        </div>
      </div>
    </section>

    <!-- ============ ResourceCards ============ -->
    <section class="mm-resources">
      <a class="mm-resource" onclick="MM.toast('Agent 文档（原型）')">
        <span class="mm-resource__icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 2h6l3 3v9H4V2Z"/><path d="M10 2v3h3M6 8h4M6 11h4"/>
          </svg>
        </span>
        <span>
          <span class="mm-resource__title">Agent文档</span>
          <span class="mm-resource__desc" style="display:block;">开始使用 MAAS Agent</span>
        </span>
      </a>
      <a class="mm-resource" onclick="MM.toast('API 参考（原型）')">
        <span class="mm-resource__icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5.5 4.5-3 3.5 3 3.5M10.5 4.5l3 3.5-3 3.5"/>
          </svg>
        </span>
        <span>
          <span class="mm-resource__title">API参考</span>
          <span class="mm-resource__desc" style="display:block;">使用 MAAS API 进行构建</span>
        </span>
      </a>
    </section>
  </div>

  <script src="assets/mm-login.js"></script>
</body>
</html>
