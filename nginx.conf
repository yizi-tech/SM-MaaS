worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" request_id=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 认证接口限流（登录/注册等暴力破解防护，5 r/s）
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # LLM 网关兜底限流（单 IP 洪泛 / 密钥泄露后被滥用的第一道闸）
    limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=30r/s;

    # 响应体上限兜底（后端另有 20 MiB 限制）
    client_max_body_size 21m;

    # SSE 默认（未被下面 location 覆盖时为安全默认值）
    proxy_buffering off;
    proxy_cache off;

    upstream mass_api {
        server api:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # ---------- 安全响应头 ----------
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'" always;

        # 前端为手写静态资源、无内容哈希打包，禁用缓存以保证改动即时生效，
        # 避免浏览器长期缓存旧 JS/HTML 导致运行期报错（如 whenReady is not a function）。
        add_header Cache-Control "no-cache" always;

        root /usr/share/nginx/html;

        # ---------- 静态资源（前端 SPA）----------
        location / {
            try_files $uri $uri/ /index.html;
            index index.html;
        }

        # ---------- 认证接口限流 ----------
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://mass_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- LLM 网关（SSE 流式，长连接）----------
        # /v1/* 兼容 OpenAI / Anthropic 网关；SSE 禁缓冲、超时放长，
        # 避免长思考/长回答被 proxy_read_timeout 掐断。
        location ~ ^/(v1|llm|api/v1/llm)/ {
            limit_req zone=llm_limit burst=60 nodelay;
            proxy_pass http://mass_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # ---------- 其余 API ----------
        location /api/ {
            proxy_pass http://mass_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}